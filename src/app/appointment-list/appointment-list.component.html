<div class="container">
  <div class="card" style="padding: 10px; margin-top: 10px;">

    <div class="row">
      <div class="col">
        <h2 class="text-center"> Create New Appointment </h2>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6" style="padding-right: 5px;">
        <input class="form-control" [(ngModel)]="newAppointmentTitle" placeholder="Appointment Description">
      </div>
      <div class="col-md-4" style="padding-left: 5px; padding-right: 5px;">
        <input class="form-control" [(ngModel)]="newAppointmentDate" type="date" placeholder="Appoointment Date">
      </div>
      <div class="col-md-2" style="padding-left: 5px;">
        <button class="btn btn-primary w-00" (click)="addAppointment()"> Add </button>
      </div>
    </div>

  </div>
</div>

<h2 class="text-center mt-5"> Appointments </h2>

<ul class="list-group mt-3">
  <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let appointment of appointments; index as i">
    {{appointment.title}} {{appointment.date | date:'dd-MM-yyyy'}}
    <button class="btn btn-danger" (click)="deleteAppointment(i)"> Delete </button>
  </li>
</ul>
